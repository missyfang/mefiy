<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Token Generator</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login {
            text-align: center;
        }
        input[type="password"] {
            padding: 8px;
            font-size: 14px;
            width: 260px;
        }
        button {
            padding: 10px 20px;
            cursor: pointer;
            font-size: 14px;
        }
        #status { color: #555; }
    </style>
</head>
<body>
    <div class="login">
        <h2>Enter Client Secret</h2>
        <input type="password" id="clientSecret" placeholder="Client Secret" /><br><br>
        <button onclick="getToken()">Get Token</button>
        <p id="status"></p>
    </div>

    <script>
        async function getToken() {
            const clientSecret = document.getElementById('clientSecret').value.trim();
            const status = document.getElementById('status');

            status.textContent = 'Waiting for Spotify login...';

            const res = await fetch('/token', {
                method: 'POST',
                body: clientSecret
            });

            if (res.ok) {
                const data = await res.json();
                const tokenBody = JSON.parse(data.token);
                localStorage.setItem('access_token', tokenBody.access_token);
                window.location.href = '/feature';
            } else {
                const data = await res.json();
                status.textContent = data.message;
            }
        }
    </script>
</body>
</html>
