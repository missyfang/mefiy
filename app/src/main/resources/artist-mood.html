<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Artist Playlist</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        a { color: #555; text-decoration: none; }
        a:hover { text-decoration: underline; }
        p { color: #555; }
        #status { margin: 16px 0; color: #555; }
        label { display: block; margin-bottom: 6px; font-weight: 600; margin-top: 16px; }
        input[type="text"] { width: 100%; padding: 8px; font-size: 14px; box-sizing: border-box; }
        button { padding: 10px 20px; cursor: pointer; font-size: 14px; margin-top: 16px; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #eee; }
        th { background: #f9f9f9; font-weight: 600; }
        .playlist-link { margin-top: 12px; }
        .playlist-link a { color: #1DB954; font-weight: 600; }
    </style>
</head>
<body>
    <a href="/feature">&larr; Back to Features</a>
    <h2>Artist Playlist</h2>
    <p>Filter your liked songs by artist IDs and create a Spotify playlist.</p>

    <label for="playlistName">Playlist Name</label>
    <input type="text" id="playlistName" placeholder="My Artist Playlist" value="Artist Playlist">

    <label for="artistIds">Artist IDs (comma-separated)</label>
    <input type="text" id="artistIds" placeholder="e.g. 6eUKZXaKkcviH0Ku9w2n3V, 1Xyo4u8uXC1ZmMpatF05PJ">

    <button onclick="createPlaylist()">Create Playlist</button>
    <p id="status"></p>
    <div id="results"></div>

    <script>
        function getToken() {
            const token = localStorage.getItem('access_token');
            if (!token) {
                alert('No token found. Please log in first.');
                window.location.href = '/';
            }
            return token;
        }

        async function createPlaylist() {
            const token = getToken();
            const artistInput = document.getElementById('artistIds').value.trim();
            const playlistName = document.getElementById('playlistName').value.trim() || 'Artist Playlist';
            const status = document.getElementById('status');
            const results = document.getElementById('results');

            if (!artistInput) {
                status.textContent = 'Please enter at least one artist ID.';
                return;
            }

            status.textContent = 'Creating playlist...';
            results.innerHTML = '';

            const res = await fetch('/api/artist-playlist', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: token, artistIds: artistInput, playlistName: playlistName })
            });

            const data = await res.json();
            if (!data.success) {
                status.textContent = 'Failed: ' + (data.message || 'unknown error');
                return;
            }

            if (data.songs.length === 0) {
                status.textContent = 'No liked songs match those artist IDs. Empty playlist created.';
            } else {
                status.textContent = 'Playlist created with ' + data.songs.length + ' songs!';
            }

            let html = '<div class="playlist-link">';
            html += '<a href="https://open.spotify.com/playlist/' + escapeHtml(data.playlistId) + '" target="_blank">';
            html += 'Open playlist in Spotify';
            html += '</a></div>';

            if (data.songs.length > 0) {
                html += '<table><tr><th>Track ID</th><th>Artists</th></tr>';
                for (const s of data.songs) {
                    html += '<tr>';
                    html += '<td>' + escapeHtml(s.trackId) + '</td>';
                    html += '<td>' + s.artistNames.map(escapeHtml).join(', ') + '</td>';
                    html += '</tr>';
                }
                html += '</table>';
            }

            results.innerHTML = html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
